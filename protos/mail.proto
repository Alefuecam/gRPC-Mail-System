//message Empty{}
/*El registro*/
message RegistroUsuario {
    
    optional string nombre = 1;
    optional int32 contra = 2;
     
}

message Usuario {
    
    optional string nombre = 1;
    optional int32 id = 2;
     
}
/*El login*/
message LoginUsuario {
    optional string nombre = 1;
    optional int32 contra = 2;
     
}
message Correos {
    optional string nombreDest = 1;
    optional string contenido = 2;
    optional string nombreRemitente=3;
    optional bool estado=4; //para saber si esta leido o no
    optional string tema=5;
    optional int32 id=6;    
}

message Status{
    optional bool success=1;
}